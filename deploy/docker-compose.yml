# 5-node RaftKV cluster.
#
#   make cluster                      # docker compose up --build -d
#   bin/raftkv-cli get k              # host ports 7001-7005 map to the nodes
#   docker kill raftkv-n3-1           # crash a node (any 2 can die)
#   docker compose -f deploy/docker-compose.yml start n3
#   curl localhost:8003/status
#
# Inside the compose network every node listens on :7000 (gRPC) and :8000
# (status); hosts n1..n5 resolve to the containers.
name: raftkv
services:
  n1:
    build: {context: .., dockerfile: deploy/Dockerfile}
    image: raftkv:latest
    command: ["--id", "1", "--peers", "1=n1:7000,2=n2:7000,3=n3:7000,4=n4:7000,5=n5:7000", "--listen", ":7000",
              "--data-dir", "/data", "--status-port", "8000"]
    volumes: ["n1-data:/data"]
    ports: ["7001:7000", "8001:8000"]
    restart: "no"

  n2:
    build: {context: .., dockerfile: deploy/Dockerfile}
    image: raftkv:latest
    command: ["--id", "2", "--peers", "1=n1:7000,2=n2:7000,3=n3:7000,4=n4:7000,5=n5:7000", "--listen", ":7000",
              "--data-dir", "/data", "--status-port", "8000"]
    volumes: ["n2-data:/data"]
    ports: ["7002:7000", "8002:8000"]
    restart: "no"

  n3:
    build: {context: .., dockerfile: deploy/Dockerfile}
    image: raftkv:latest
    command: ["--id", "3", "--peers", "1=n1:7000,2=n2:7000,3=n3:7000,4=n4:7000,5=n5:7000", "--listen", ":7000",
              "--data-dir", "/data", "--status-port", "8000"]
    volumes: ["n3-data:/data"]
    ports: ["7003:7000", "8003:8000"]
    restart: "no"

  n4:
    build: {context: .., dockerfile: deploy/Dockerfile}
    image: raftkv:latest
    command: ["--id", "4", "--peers", "1=n1:7000,2=n2:7000,3=n3:7000,4=n4:7000,5=n5:7000", "--listen", ":7000",
              "--data-dir", "/data", "--status-port", "8000"]
    volumes: ["n4-data:/data"]
    ports: ["7004:7000", "8004:8000"]
    restart: "no"

  n5:
    build: {context: .., dockerfile: deploy/Dockerfile}
    image: raftkv:latest
    command: ["--id", "5", "--peers", "1=n1:7000,2=n2:7000,3=n3:7000,4=n4:7000,5=n5:7000", "--listen", ":7000",
              "--data-dir", "/data", "--status-port", "8000"]
    volumes: ["n5-data:/data"]
    ports: ["7005:7000", "8005:8000"]
    restart: "no"

volumes:
  n1-data: {}
  n2-data: {}
  n3-data: {}
  n4-data: {}
  n5-data: {}
